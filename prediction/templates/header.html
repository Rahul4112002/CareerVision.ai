{% load static %}
<!-- Modern Enhanced Header -->
<header class="bg-white border-b border-gray-100 shadow-sm">
  <div class="mx-auto max-w-screen-2xl px-6 md:px-8">
    <div class="flex items-center justify-between py-3 md:py-4">
      <!-- Logo - start -->
      <a href="/" class="group inline-flex items-center gap-3 text-xl font-bold text-gray-900 md:text-2xl transition-all duration-300 hover:scale-[1.02]" aria-label="CareerVision.ai Home">
        <div class="relative">
          <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl blur-lg opacity-20 group-hover:opacity-40 transition-opacity duration-300"></div>
          <img src="{% static 'images/cv.png' %}" alt="CareerVision.ai Logo" width="40" height="40" class="relative rounded-xl" />
        </div>
        <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent tracking-tight">
          Career<span class="font-extrabold">Vision</span>
        </span>
      </a>
      <!-- Logo - end -->

      <!-- Desktop Navigation - start -->
      <nav class="hidden lg:flex items-center gap-8 xl:gap-10">
        <a href="/" class="group relative text-base font-semibold text-gray-700 transition-all duration-300 hover:text-indigo-600 py-2">
          <span class="relative z-10">Home</span>
          <div class="absolute inset-x-0 -bottom-1 h-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
        </a>
        <a href="#features" class="group relative text-base font-semibold text-gray-700 transition-all duration-300 hover:text-indigo-600 nav-link py-2">
          <span class="relative z-10">Features</span>
          <div class="absolute inset-x-0 -bottom-1 h-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
        </a>
        <a href="{% url 'prediction' %}" class="group relative text-base font-semibold text-gray-700 transition-all duration-300 hover:text-indigo-600 py-2">
          <span class="relative z-10">Predict Career</span>
          <div class="absolute inset-x-0 -bottom-1 h-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
        </a>
        <a href="{% url 'roadmap' %}" class="group relative text-base font-semibold text-gray-700 transition-all duration-300 hover:text-indigo-600 py-2">
          <span class="relative z-10">Roadmaps</span>
          <div class="absolute inset-x-0 -bottom-1 h-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
        </a>
        <a href="#faq" class="group relative text-base font-semibold text-gray-700 transition-all duration-300 hover:text-indigo-600 nav-link py-2">
          <span class="relative z-10">FAQ</span>
          <div class="absolute inset-x-0 -bottom-1 h-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>
        </a>
      </nav>
      <!-- Desktop Navigation - end -->

      <!-- CTA Button + Mobile Menu - start -->
      <div class="flex items-center gap-4">
        <!-- CTA Button (hidden on mobile) -->
        <a href="{% url 'prediction' %}" class="hidden md:inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          Start Now
        </a>

        <!-- Mobile Menu Button -->
        <button type="button" id="mobile-menu-button" class="lg:hidden inline-flex items-center gap-2 rounded-lg bg-gray-50 px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-200">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <span>Menu</span>
        </button>
      </div>
      <!-- CTA Button + Mobile Menu - end -->
    </div>

    <!-- Mobile Navigation Menu - start -->
    <div id="mobile-menu" class="lg:hidden hidden border-t border-gray-100 bg-white">
      <div class="px-4 py-4 space-y-3">
        <a href="/" class="block px-4 py-3 text-base font-semibold text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all duration-200">
          🏠 Home
        </a>
        <a href="#features" class="nav-link block px-4 py-3 text-base font-semibold text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all duration-200">
          ⭐ Features
        </a>
        <a href="{% url 'prediction' %}" class="block px-4 py-3 text-base font-semibold text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all duration-200">
          🔮 Predict Career
        </a>
        <a href="{% url 'roadmap' %}" class="block px-4 py-3 text-base font-semibold text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all duration-200">
          🗺️ Roadmaps
        </a>
        <a href="#faq" class="nav-link block px-4 py-3 text-base font-semibold text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all duration-200">
          ❓ FAQ
        </a>
        
        <!-- Mobile CTA -->
        <div class="pt-4 border-t border-gray-100">
          <a href="{% url 'prediction' %}" class="flex items-center justify-center gap-2 w-full px-6 py-3 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            Start Your Career Journey
          </a>
        </div>
      </div>
    </div>
    <!-- Mobile Navigation Menu - end -->
  </div>
</header>

<!-- Mobile Menu JavaScript -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    
    if (mobileMenuButton && mobileMenu) {
      mobileMenuButton.addEventListener('click', function() {
        mobileMenu.classList.toggle('hidden');
      });
      
      // Close mobile menu when clicking nav links
      const navLinks = mobileMenu.querySelectorAll('a');
      navLinks.forEach(link => {
        link.addEventListener('click', function() {
          mobileMenu.classList.add('hidden');
        });
      });
    }
  });
</script>
